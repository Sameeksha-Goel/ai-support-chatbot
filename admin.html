<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 28px 20px;
    }

    /* ── Header ── */
    .admin-header {
      max-width: 900px; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 14px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: #c9b800; display: flex; align-items: center;
      justify-content: center; font-size: 20px; font-weight: 900; color: #0a0a0a;
    }
    h1 { font-size: 22px; font-weight: 800; color: #fff; }

    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* ── Stats bar ── */
    .stats-bar {
      max-width: 900px; margin: 0 auto 20px;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .stat-pill {
      font-size: 13px; color: #c9b800;
      background: rgba(201,184,0,0.1);
      border: 1px solid rgba(201,184,0,0.2);
      padding: 6px 14px; border-radius: 20px;
    }
    .stat-pill.handoff { color: #f97316; background: rgba(249,115,22,0.1); border-color: rgba(249,115,22,0.2); }
    .stat-pill.live { color: #4ade80; background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.2); display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    /* ── Tabs ── */
    .tabs {
      max-width: 900px; margin: 0 auto 20px;
      display: flex; gap: 4px;
      background: #1a1a1a; border-radius: 12px; padding: 4px; width: fit-content;
    }
    .tab {
      padding: 8px 18px; border-radius: 9px; border: none;
      background: none; color: #666; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .tab.active { background: #c9b800; color: #0a0a0a; }
    .tab:not(.active):hover { color: #c9b800; }

    /* ── Controls ── */
    .controls {
      max-width: 900px; margin: 0 auto 20px;
      display: flex; gap: 10px;
    }
    #search {
      flex: 1; padding: 10px 18px;
      background: #1a1a1a; border: 1.5px solid #242424;
      border-radius: 10px; outline: none;
      font-family: inherit; font-size: 14px; color: #e0e0e0;
      transition: border-color 0.18s;
    }
    #search:focus { border-color: #c9b800; }
    #search::placeholder { color: #444; }

    .btn {
      padding: 10px 18px; border: none; border-radius: 10px;
      cursor: pointer; font-size: 13px; font-weight: 700;
      transition: opacity 0.15s, transform 0.15s;
    }
    .btn:hover { opacity: 0.88; transform: scale(1.02); }
    .btn-gold { background: #c9b800; color: #0a0a0a; }
    .btn-outline { background: none; border: 1px solid #2a2a2a; color: #888; }
    .btn-outline:hover { border-color: #c9b800; color: #c9b800; }

    /* ── Tab Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Chat Card ── */
    .chat-card {
      background: #111111; border: 1px solid #1e1e1e;
      border-radius: 16px; padding: 20px;
      margin: 0 auto 14px; max-width: 900px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .chat-card:hover { border-color: #2a2a2a; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .chat-card.handoff-card { border-color: rgba(249,115,22,0.3); }

    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 10px; flex-wrap: wrap;
    }
    .user-id {
      font-size: 11px; font-weight: 700; color: #c9b800;
      background: rgba(201,184,0,0.08); border: 1px solid rgba(201,184,0,0.2);
      padding: 3px 9px; border-radius: 20px; letter-spacing: 0.03em;
      max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .msg-badge {
      font-size: 10px; font-weight: 700; color: #888;
      background: #1e1e1e; border: 1px solid #2a2a2a;
      padding: 3px 8px; border-radius: 20px;
    }
    .handoff-badge {
      font-size: 10px; font-weight: 700; color: #f97316;
      background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.25);
      padding: 3px 8px; border-radius: 20px;
    }

    .last-preview {
      font-size: 14px; font-weight: 500; color: #bbb;
      margin-bottom: 14px; padding-bottom: 14px;
      border-bottom: 1px solid #1a1a1a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .last-preview strong { color: #c9b800; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px; }

    .messages { display: flex; flex-direction: column; gap: 6px; }
    .msg { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
    .msg-role {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 4px; flex-shrink: 0; margin-top: 2px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .msg.user-msg .msg-role { background: rgba(201,184,0,0.15); color: #c9b800; }
    .msg.bot-msg  .msg-role { background: rgba(74,222,128,0.1); color: #4ade80; }
    .msg-content { color: #ccc; flex: 1; }
    .msg-time { font-size: 10px; color: #333; flex-shrink: 0; }

    .delete-btn {
      margin-top: 12px; padding: 7px 14px;
      background: rgba(255,77,77,0.1); color: #ff4d4d;
      border: 1px solid rgba(255,77,77,0.2); border-radius: 8px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      opacity: 0.7; transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .chat-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: rgba(255,77,77,0.2); border-color: rgba(255,77,77,0.4); }

    /* ── Unanswered Questions ── */
    .unanswered-card {
      background: #111111; border: 1px solid #1e1e1e;
      border-radius: 12px; padding: 14px 18px;
      margin: 0 auto 10px; max-width: 900px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .unanswered-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .unanswered-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .unanswered-q { font-size: 14px; color: #e0e0e0; flex: 1; }
    .unanswered-meta { font-size: 11px; color: #444; text-align: right; }
    .add-faq-btn {
      padding: 5px 12px; font-size: 12px; font-weight: 600;
      background: rgba(201,184,0,0.08); color: #c9b800;
      border: 1px solid rgba(201,184,0,0.25); border-radius: 8px;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .add-faq-btn:hover { background: rgba(201,184,0,0.15); border-color: rgba(201,184,0,0.5); }
    .faq-inline-form { display: flex; flex-direction: column; gap: 8px; }
    .faq-answer-input {
      width: 100%; padding: 10px 14px;
      background: #1a1a1a; border: 1.5px solid #2a2a2a;
      border-radius: 10px; outline: none; resize: vertical;
      font-family: inherit; font-size: 13px; color: #e0e0e0;
      min-height: 80px; transition: border-color 0.18s;
    }
    .faq-answer-input:focus { border-color: #c9b800; }
    .faq-answer-input::placeholder { color: #444; }
    .save-faq-btn {
      padding: 7px 16px; font-size: 12px; font-weight: 700;
      background: #c9b800; color: #0a0a0a;
      border: none; border-radius: 8px; cursor: pointer;
      transition: opacity 0.15s;
    }
    .save-faq-btn:hover { opacity: 0.88; }
    .save-faq-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cancel-faq-btn {
      padding: 7px 14px; font-size: 12px; font-weight: 600;
      background: none; color: #555;
      border: 1px solid #2a2a2a; border-radius: 8px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .cancel-faq-btn:hover { color: #888; border-color: #444; }

    .empty-state { text-align: center; color: #333; padding: 60px 0; font-size: 15px; }

    /* ── Reports ── */
    .report-card {
      background: #111111; border: 1px solid #1e1e1e;
      border-radius: 12px; padding: 16px 20px;
      margin: 0 auto 10px; max-width: 900px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .report-card.resolved { opacity: 0.5; }
    .report-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .report-order { font-size: 13px; font-weight: 700; color: #c9b800; }
    .report-meta { font-size: 11px; color: #555; }
    .report-type {
      font-size: 11px; font-weight: 700; color: #f97316;
      background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.25);
      padding: 2px 8px; border-radius: 20px; width: fit-content;
    }
    .status-badge-open {
      font-size: 11px; font-weight: 700; color: #f97316;
      background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.25);
      padding: 3px 10px; border-radius: 20px;
    }
    .status-badge-resolved {
      font-size: 11px; font-weight: 700; color: #4ade80;
      background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25);
      padding: 3px 10px; border-radius: 20px;
    }
    .resolve-btn {
      padding: 7px 14px;
      background: rgba(74,222,128,0.08); color: #4ade80;
      border: 1px solid rgba(74,222,128,0.25); border-radius: 8px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .resolve-btn:hover { background: rgba(74,222,128,0.16); border-color: rgba(74,222,128,0.45); }

    /* ── FAQ Entries ── */
    .faq-entry-card {
      background: #111111; border: 1px solid #1e1e1e;
      border-radius: 12px; padding: 14px 18px;
      margin: 0 auto 10px; max-width: 900px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .faq-entry-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .faq-entry-q { font-size: 13px; font-weight: 600; color: #e0e0e0; }
    .faq-entry-a { font-size: 12px; color: #555; line-height: 1.5; }
    .widget-toggle {
      padding: 6px 14px; font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
      background: none; color: #555; border: 1px solid #2a2a2a;
      border-radius: 8px; cursor: pointer; transition: all 0.15s;
    }
    .widget-toggle:hover { color: #888; border-color: #444; }
    .widget-toggle.active { background: rgba(201,184,0,0.1); color: #c9b800; border-color: rgba(201,184,0,0.35); }

    /* ── Countdown ── */
    #countdown { font-size: 11px; color: #444; }
  </style>
</head>
<body>

  <div class="admin-header">
    <div class="header-left">
      <div class="brand-icon">A</div>
      <h1>Admin Panel</h1>
    </div>
    <div class="header-actions">
      <span id="countdown"></span>
      <a href="/admin/export" class="btn btn-outline" download>⬇ Export CSV</a>
      <a href="/logout" class="btn btn-outline">Sign Out</a>
      <button class="btn btn-gold" onclick="loadAll()">↺ Refresh</button>
    </div>
  </div>

  <div class="stats-bar">
    <span class="stat-pill" id="stat-total">— Conversations</span>
    <span class="stat-pill" id="stat-msgs">— Messages</span>
    <span class="stat-pill handoff" id="stat-handoff">— Human Requests</span>
    <span class="stat-pill live"><span class="live-dot"></span> Live dashboard</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('chats', this)">💬 Conversations</button>
    <button class="tab" onclick="switchTab('unanswered', this)">❓ Unanswered</button>
    <button class="tab" onclick="switchTab('reports', this)">📋 Reports</button>
    <button class="tab" onclick="switchTab('faq', this)">📚 FAQ</button>
  </div>

  <!-- Conversations panel -->
  <div class="panel active" id="panel-chats">
    <div class="controls">
      <input id="search" placeholder="Search by user ID..." oninput="filterChats()" />
    </div>
    <div id="chatContainer"></div>
  </div>

  <!-- Unanswered questions panel -->
  <div class="panel" id="panel-unanswered">
    <div id="unansweredContainer"></div>
  </div>

  <!-- Reports panel -->
  <div class="panel" id="panel-reports">
    <div id="reportsContainer"></div>
  </div>

  <!-- FAQ entries panel -->
  <div class="panel" id="panel-faq">
    <div id="faqEntriesContainer"></div>
  </div>

<script>
  const API = "";
  let allChats = [];
  let refreshInterval;
  let countdown = 30;

  function switchTab(name, btn) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + name).classList.add("active");
  }

  async function loadAll() {
    await Promise.all([loadChats(), loadUnanswered(), loadReports(), loadFaqEntries()]);
    countdown = 30;
  }

  // ── Conversations ──────────────────────────────────────────────────────────
  async function loadChats() {
    const data = await fetch(`${API}/admin/chats`).then(r => r.json());
    allChats = data;
    displayChats(data);

    const totalMsgs = data.reduce((sum, c) => sum + c.messages.length, 0);
    const handoffCount = data.filter(c => c.requestedHuman).length;
    document.getElementById("stat-total").textContent = `${data.length} Conversation${data.length !== 1 ? "s" : ""}`;
    document.getElementById("stat-msgs").textContent = `${totalMsgs} Messages`;
    document.getElementById("stat-handoff").textContent = `${handoffCount} Human Request${handoffCount !== 1 ? "s" : ""}`;
  }

  function displayChats(chats) {
    const container = document.getElementById("chatContainer");
    container.innerHTML = "";

    if (chats.length === 0) {
      container.innerHTML = `<div class="empty-state">No conversations found</div>`;
      return;
    }

    chats.forEach(chat => {
      const card = document.createElement("div");
      card.className = "chat-card" + (chat.requestedHuman ? " handoff-card" : "");

      const lastMsg = chat.messages[chat.messages.length - 1];

      card.innerHTML = `
        <div class="card-header">
          <span class="user-id">${chat.userId}</span>
          <div class="card-meta">
            ${chat.requestedHuman ? `<span class="handoff-badge">🙋 Needs Agent</span>` : ""}
            <span class="msg-badge">${chat.messages.length} msgs</span>
          </div>
        </div>
        <div class="last-preview">
          <strong>Last</strong>${lastMsg ? lastMsg.content : "No messages"}
        </div>
        <div class="messages" id="msgs-${chat._id}"></div>
        <button class="delete-btn" onclick="deleteChat('${chat._id}')">Delete Chat</button>
      `;

      const msgsDiv = card.querySelector(`#msgs-${chat._id}`);
      chat.messages.forEach(msg => {
        const div = document.createElement("div");
        div.className = `msg ${msg.role === "user" ? "user-msg" : "bot-msg"}`;
        const timeStr = msg.timestamp
          ? new Date(msg.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : "";
        div.innerHTML = `
          <span class="msg-role">${msg.role === "user" ? "User" : "Bot"}</span>
          <span class="msg-content">${msg.content}</span>
          ${timeStr ? `<span class="msg-time">${timeStr}</span>` : ""}
        `;
        msgsDiv.appendChild(div);
      });

      container.appendChild(card);
    });
  }

  function filterChats() {
    const value = document.getElementById("search").value.toLowerCase();
    displayChats(allChats.filter(c => c.userId.toLowerCase().includes(value)));
  }

  function deleteChat(id) {
    if (!confirm("Are you sure you want to delete this chat?")) return;
    fetch(`${API}/admin/chats/${id}`, { method: "DELETE" })
      .then(() => loadChats());
  }

  // ── Unanswered questions ───────────────────────────────────────────────────
  async function loadUnanswered() {
    const data = await fetch(`${API}/admin/unanswered`).then(r => r.json());
    const container = document.getElementById("unansweredContainer");
    container.innerHTML = "";

    if (!data.length) {
      container.innerHTML = `<div class="empty-state">No unanswered questions yet</div>`;
      return;
    }

    data.forEach(item => {
      const card = document.createElement("div");
      card.className = "unanswered-card";
      const ts = item.timestamp ? new Date(item.timestamp).toLocaleString() : "";
      const escapedQ = item.question.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
      card.innerHTML = `
        <div class="unanswered-top">
          <span class="unanswered-q">${item.question}</span>
          <div class="unanswered-right">
            <div class="unanswered-meta">
              <div>${item.userId?.slice(0, 10)}...</div>
              <div>${ts}</div>
            </div>
            <button class="add-faq-btn" onclick="toggleFaqForm(this)">+ Add to FAQ</button>
          </div>
        </div>
        <div class="faq-inline-form" style="display:none">
          <textarea class="faq-answer-input" placeholder="Type the answer for this question..."></textarea>
          <div style="display:flex;gap:8px">
            <button class="save-faq-btn" data-question="${escapedQ}" onclick="saveFaq(this)">Save to FAQ</button>
            <button class="cancel-faq-btn" onclick="toggleFaqForm(this.closest('.unanswered-card').querySelector('.add-faq-btn'))">Cancel</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // ── FAQ from unanswered ────────────────────────────────────────────────────
  function toggleFaqForm(addBtn) {
    const card = addBtn.closest(".unanswered-card");
    const form = card.querySelector(".faq-inline-form");
    const visible = form.style.display !== "none";
    form.style.display = visible ? "none" : "flex";
    addBtn.textContent = visible ? "+ Add to FAQ" : "Cancel";
  }

  async function saveFaq(saveBtn) {
    const card = saveBtn.closest(".unanswered-card");
    const question = saveBtn.dataset.question;
    const answer = card.querySelector(".faq-answer-input").value.trim();
    if (!answer) return;

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    await fetch(`${API}/admin/faq`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, answer })
    });

    saveBtn.textContent = "Saved! ✅";
    setTimeout(() => {
      card.querySelector(".faq-inline-form").style.display = "none";
      card.querySelector(".add-faq-btn").textContent = "+ Add to FAQ";
      saveBtn.disabled = false;
      saveBtn.textContent = "Save to FAQ";
    }, 1500);
  }

  // ── Reports ───────────────────────────────────────────────────────────────
  async function loadReports() {
    const data = await fetch(`${API}/admin/reports`).then(r => r.json());
    const container = document.getElementById("reportsContainer");
    container.innerHTML = "";

    if (!data.length) {
      container.innerHTML = `<div class="empty-state">No reports filed yet</div>`;
      return;
    }

    data.forEach(report => {
      const card = document.createElement("div");
      card.className = "report-card" + (report.status === "resolved" ? " resolved" : "");
      const ts = report.timestamp ? new Date(report.timestamp).toLocaleString() : "";
      const issueLabel = report.issueType.replace(/_/g, " ");

      card.innerHTML = `
        <div class="report-info">
          <span class="report-order">Order #${report.orderId}</span>
          <span class="report-type">${issueLabel}</span>
          <span class="report-meta">${report.userId?.slice(0, 12)}... · ${ts}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
          <span class="${report.status === "resolved" ? "status-badge-resolved" : "status-badge-open"}">
            ${report.status === "resolved" ? "✅ Resolved" : "🔴 Open"}
          </span>
          ${report.status !== "resolved" ? `<button class="resolve-btn" onclick="resolveReport('${report._id}', this)">Mark Resolved</button>` : ""}
        </div>
      `;

      container.appendChild(card);
    });
  }

  async function resolveReport(id, btn) {
    btn.disabled = true;
    btn.textContent = "Updating...";
    await fetch(`${API}/admin/reports/${id}`, { method: "PATCH" });
    await loadReports();
  }

  // ── FAQ Entries ───────────────────────────────────────────────────────────
  async function loadFaqEntries() {
    const data = await fetch(`${API}/admin/faq`).then(r => r.json());
    const container = document.getElementById("faqEntriesContainer");
    container.innerHTML = "";

    if (!data.length) {
      container.innerHTML = `<div class="empty-state">No FAQ entries yet. Add some from the Unanswered tab.</div>`;
      return;
    }

    data.forEach(entry => {
      const card = document.createElement("div");
      card.className = "faq-entry-card";
      const escapedQ = entry.question.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const escapedA = entry.answer.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      card.innerHTML = `
        <div class="faq-entry-info">
          <div class="faq-entry-q">${escapedQ}</div>
          <div class="faq-entry-a">${escapedA}</div>
        </div>
        <button class="widget-toggle ${entry.showInWidget ? "active" : ""}" onclick="toggleWidget('${entry._id}', this)">
          ${entry.showInWidget ? "In Widget ✓" : "Show in Widget"}
        </button>
      `;
      container.appendChild(card);
    });
  }

  async function toggleWidget(id, btn) {
    btn.disabled = true;
    const res = await fetch(`${API}/admin/faq/${id}`, { method: "PATCH" });
    const data = await res.json();
    btn.textContent = data.showInWidget ? "In Widget ✓" : "Show in Widget";
    btn.classList.toggle("active", data.showInWidget);
    btn.disabled = false;
  }

  // ── Live dashboard (auto-refresh every 30s) ────────────────────────────────
  function startLiveRefresh() {
    refreshInterval = setInterval(async () => {
      countdown--;
      document.getElementById("countdown").textContent = `Refreshing in ${countdown}s`;
      if (countdown <= 0) {
        const faqFormOpen = [...document.querySelectorAll(".faq-inline-form")].some(f => f.style.display !== "none");
        await loadChats();
        if (!faqFormOpen) await loadUnanswered();
        await loadReports();
        await loadFaqEntries();
        countdown = 30;
      }
    }, 1000);
  }

  // Init
  loadAll();
  startLiveRefresh();
</script>

</body>
</html>
